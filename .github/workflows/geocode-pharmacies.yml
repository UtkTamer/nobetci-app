name: Geocode pharmacies

# Runs after every refresh; no separate cron, which used to fire a second,
# redundant pass every day.
on:
  workflow_dispatch:
    inputs:
      city_filter:
        description: "Comma separated city slugs (blank = all configured cities)"
        required: false
        default: ""
  workflow_run:
    workflows:
      - Refresh pharmacies
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  geocode:
    name: Geocode pharmacies
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 45
    env:
      CITY_FILTER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.city_filter || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run pharmacy geocoding
        working-directory: scripts
        env:
          CITY_FILTER: ${{ env.CITY_FILTER }}
          GEOCODE_ONLY: '1'
        run: node refresh.mjs

      - name: Commit updated coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api scripts/geocode-cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: geocode pharmacy data [skip ci]"
            git push
          fi
